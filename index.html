<!doctype html>
<!-- A11Y-15: language is declared. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#d5cfbe" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      PERF (12.4): the hero portrait is the LCP element on every viewport.
      The preload starts its fetch at t≈0 so the boot shell below can paint it
      before hydration; without the hint the fetch queues behind the module
      graph and the paint lands past the 2.5s floor on throttled mobile.
    -->
    <link rel="preload" as="image" href="/moin-portrait.webp" fetchpriority="high" />
    <!--
      apple-touch-icon.png is intentionally not linked yet: a <link> to a file
      that does not exist is a guaranteed 404 on every iOS visit. It goes in
      with the real favicon set, which needs the final brand mark (Q-04).
      Pre-launch checklist item: "favicon and manifest present" (41.8).
    -->

    <!-- Fallback metadata only. Every route renders its own via <SEO> (SEO-01). -->
    <title>Moin Patel — AI Developer &amp; AI Automation Executive</title>
    <meta
      name="description"
      content="Building AI-powered systems that automate work, save time, and reduce business costs."
    />

    <!--
      PERF-08: fonts are self-hosted, so there is nothing to preconnect to.

      One preload, for the sans only. It carries both the display and body
      roles and every one of them is above the fold, so the request is on the
      critical path either way and hinting it is free. Geist Mono is not
      preloaded: it renders small metadata labels that mostly sit below the
      fold, and preloading it would compete with the face the first paint
      actually needs. Preloading everything is the same as preloading nothing.

      `crossorigin` is required even same-origin — fonts are fetched in CORS
      mode, and without it the browser downloads the file twice.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/geist-sans-variable.woff2"
      crossorigin
    />

    <style>
      /*
       * PRD 39 — initial app load: a minimal inline shell painted before any
       * JavaScript runs, replaced on hydration. No full-screen branded splash.
       * Inlined deliberately so it costs zero extra requests.
       */
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        color: #000000;
      }
      /*
       * The background is on html ONLY, never on body.
       *
       * The ambient layer (the CSS blob field, and the WebGL scene since
       * Phase 2) is a fixed element at z-index -10. Negative-z descendants
       * paint after the root element's background but before the block
       * backgrounds of in-flow elements — so a background on body covers the
       * entire layer. It did exactly that, invisibly, until it was measured.
       *
       * These literals are duplicated from --color-base in tokens.css because
       * this block is inlined to paint before any stylesheet loads and cannot
       * reference a custom property that does not exist yet. Keep them in step.
       */
      html {
        background: #d5cfbe;
      }
      #root {
        min-height: 100dvh;
      }
      /*
       * The boot shell IS the hero's first paint (12.4).
       *
       * The old pulsing "MP" mark held the viewport until hydration — which
       * put the real LCP element (the portrait) behind ~2s of JS execution on
       * a throttled phone and left LCP straddling the 2.5s floor. This static
       * copy paints the wordmark and portrait at the hero's exact geometry
       * before any script runs; when React mounts the same composition, the
       * swap is pixel-stable, the browser records no larger paint, and LCP
       * stays at the boot paint.
       *
       * The literals mirror HeroSection.tsx layer for layer — wordmark at
       * top 7%, clamp(3.5rem, 16vw, 14rem)/0.78/-0.045em in the accent-word
       * teal; portrait bottom-anchored at 80svh (91svh from lg). A drifted
       * copy is a visible jump at hydration, so change them together.
       */
      .boot-shell {
        /* The header is `fixed` (PublicLayout), so NOTHING sits in flow above
           the hero and this box starts at y=0 on every viewport. It therefore
           spans exactly [0, 100svh] and needs no offset.

           This used to carry a `--boot-top` of 27px (44px below md) to mirror
           the height an in-flow header rendered at. That variable is gone with
           the header's flow height: reintroducing an offset here without one
           above would put the pre-hydration hero and the React hero in
           different places, which is a visible jump at hydration and a CLS
           regression on a metric measuring 0.0000. */
        position: relative;
        min-height: 100svh;
        overflow: hidden;
      }
      .boot-shell__wordmark {
        position: absolute;
        inset-inline: 0;
        top: 7svh;
        text-align: center;
        white-space: nowrap;
        font-family:
          'Geist',
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        font-weight: 700;
        font-size: clamp(3.5rem, 16vw, 14rem);
        line-height: 0.78;
        letter-spacing: -0.045em;
        color: #0b7d8c;
        pointer-events: none;
        user-select: none;
      }
      .boot-shell__portrait {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        height: 80svh;
        width: auto;
        max-width: none;
        /* globals.css caps media with an unlayered max-inline-size: 100%;
           without this escape the app stylesheet (which loads before
           hydration) would letterbox the boot figure at phone widths. */
        max-inline-size: none;
        object-fit: contain;
        object-position: bottom;
      }
      @media (min-width: 1024px) {
        .boot-shell__portrait {
          height: 91svh;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell">
        <!-- aria-hidden / empty alt: this is a visual pre-paint of the hero,
             replaced wholesale at hydration; the accessible hero (h1, real
             alt text) is the React render. -->
        <span class="boot-shell__wordmark" aria-hidden="true">MOIN PATEL</span>
        <img
          class="boot-shell__portrait"
          src="/moin-portrait.webp"
          alt=""
          decoding="sync"
          fetchpriority="high"
        />
      </div>
    </div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        This site needs JavaScript to load its content. You can still reach Moin Patel by email.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
